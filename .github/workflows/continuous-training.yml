name: Continuous Training

on:
  workflow_dispatch:        # déclenchement manuel depuis l'onglet Actions
    inputs:
      tune:
        description: "Grid search complet (true) ou fit rapide avec HP fixes (false)"
        type: choice
        options: ["true", "false"]
        default: "true"
      register_alias:
        description: "Alias posé sur la nouvelle version du modèle dans le registry"
        default: "challenger"
  # schedule:               # décommenter pour un réentraînement planifié
  #   - cron: "0 3 * * 1"   # tous les lundis à 3h du matin (UTC)

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/train-demo:latest
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1 — Construire l'image de train et la pousser sur Docker Hub
  # ---------------------------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Login Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            --username "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin

      - name: Build de l'image de train
        run: docker build -t $IMAGE_NAME ./train

      - name: Push vers Docker Hub
        run: docker push $IMAGE_NAME

  # ---------------------------------------------------------------------------
  # JOB 2 — Provisionner un EC2 éphémère qui pull l'image, entraîne,
  #         envoie le modèle sur MLflow puis se termine tout seul
  # ---------------------------------------------------------------------------
  train-on-ec2:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      # L'AWS CLI est préinstallée sur les runners ubuntu-latest,
      # elle lit directement les credentials depuis les variables d'env ci-dessus.

      - name: Récupérer l'AMI Amazon Linux 2023 la plus récente
        id: ami
        run: |
          AMI_ID=$(aws ssm get-parameter \
            --name /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64 \
            --query "Parameter.Value" --output text)
          echo "Ami utilisée : $AMI_ID"
          echo "ami_id=$AMI_ID" >> "$GITHUB_OUTPUT"

      - name: Générer le script user-data
        run: |
          cat > user-data.sh << EOF
          #!/bin/bash
          # La machine doit TOUJOURS s'éteindre (succès ou échec), sinon un
          # crash silencieux la laisse tourner indéfiniment (coûts + le
          # workflow attend une terminaison qui n'arrive jamais).
          trap 'shutdown -h now' EXIT
          set -e
          dnf install -y docker
          systemctl start docker

          docker run --rm \
            -e MLFLOW_TRACKING_URI="${{ secrets.MLFLOW_TRACKING_URI }}" \
            -e AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
            -e AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            -e AWS_DEFAULT_REGION="${{ secrets.AWS_DEFAULT_REGION }}" \
            -e TUNE="${{ inputs.tune || 'true' }}" \
            -e REGISTER_ALIAS="${{ inputs.register_alias || 'challenger' }}" \
            $IMAGE_NAME
          EOF

      - name: Lancer l'instance EC2
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 run-instances \
            --image-id ${{ steps.ami.outputs.ami_id }} \
            --instance-type t3.medium \
            --instance-initiated-shutdown-behavior terminate \
            --user-data file://user-data.sh \
            --tag-specifications 'ResourceType=instance,Tags=[{Key=Name,Value=continuous-training}]' \
            --query "Instances[0].InstanceId" --output text)
          echo "Instance lancée : $INSTANCE_ID"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Attendre la fin de l'entraînement (= terminaison de l'instance)
        run: |
          INSTANCE_ID=${{ steps.ec2.outputs.instance_id }}
          echo "⏳ En attente que l'instance $INSTANCE_ID se termine..."

          # Boucle de polling : on vérifie l'état toutes les 30s, timeout 20 min
          for i in $(seq 1 40); do
            STATE=$(aws ec2 describe-instances \
              --instance-ids $INSTANCE_ID \
              --query "Reservations[0].Instances[0].State.Name" --output text)
            echo "[$i/40] État de l'instance : $STATE"
            if [ "$STATE" = "terminated" ]; then
              echo "✅ Entraînement terminé, le modèle est sur MLflow."
              exit 0
            fi
            sleep 30
          done

          echo "❌ Timeout : l'instance ne s'est pas terminée en 20 minutes."
          echo "Pensez à la terminer manuellement pour éviter les coûts :"
          echo "aws ec2 terminate-instances --instance-ids $INSTANCE_ID"
          exit 1
